spring:
  application:
    name: coolify-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coolify_lab}
    username: ${DB_USERNAME:coolify_lab}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

app:
  instance-name: ${INSTANCE_NAME:${HOSTNAME:local}}
  cache:
    enabled: ${CACHE_ENABLED:true}
    task-ttl: ${TASK_CACHE_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot deployment lab for Coolify

logging:
  level:
    root: INFO
    dev.lab.coolify: INFO
